spring:
  application:
    name: usermanagmentservice

  datasource:
    url: jdbc:mysql://localhost:3306/usermanagmentdb
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update   # create | update | validate | none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
 port: 8080

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export: http://localhost:4317/v1/traces
